<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Works — Saf Speaks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <a class="wordmark" href="./index.html">Saf Speaks</a>
        <nav>
          <a href="./index.html">About</a>
          <a class="active" href="./works.html">Works</a>
          <a href="./projects.html">Projects</a>
          <a href="./resume.html">Resume</a>
        </nav>
      </header>

      <main class="fade">
        <p class="kicker">Works</p>
        <h1>Selected work</h1>
        <p class="lead">Click a piece to open a little more. Nothing extra.</p>

        <div class="list">
          <button class="card" type="button" data-toggle>
            <div class="card-top">
              <h2>Saf Speaks</h2>
              <span class="year">Brand</span>
            </div>
            <p class="one-line">My name for writing and showing up as myself online.</p>
            <div class="more">
              <p>
                Saf Speaks is the gold wordmark at the top of this site. It’s the
                quieter side of my work: how I talk about products, time, and
                building in public, without making it complicated.
              </p>
            </div>
          </button>

          <button class="card" type="button" data-toggle>
            <div class="card-top">
              <h2>LeaveBy</h2>
              <span class="year">2026 · Product</span>
            </div>
            <p class="one-line">A planner that tells you when to leave, not just when to arrive.</p>
            <div class="more">
              <p>
                Built as a vibe-coding product for MOR-531. You see a day of events,
                tap one, and get a leave-at time with walk / drive / transit in mind.
                The live build is on the Projects page.
              </p>
            </div>
          </button>

          <button class="card" type="button" data-toggle>
            <div class="card-top">
              <h2>Time, on purpose</h2>
              <span class="year">Idea</span>
            </div>
            <p class="one-line">Why packed days fail: the calendar never counted the commute.</p>
            <div class="more">
              <p>
                Students and people who work are not bad at planning. They are
                missing the leave time. That’s the problem I keep coming back to,
                and it’s what LeaveBy is for.
              </p>
            </div>
          </button>
        </div>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
